[project]
name = "huggin-face-rl-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gym>=0.26.2",
    "gymnasium[atari]>=1.3.0",
    "huggingface-hub>=1.29.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "moviepy>=2.2.1",
    "nbconvert>=7.17.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "pyvirtualdisplay>=3.0",
    "requests>=2.34.2",
    "rl-zoo3>=2.9.1",
    "tqdm>=4.70.0",
]

[tool.uv]
# huggingface-sb3 3.0（rl_zoo3 的依赖，PyPI 最新）过时地钉死 huggingface-hub~=0.8；
# 它实际只用 HfApi / upload_folder / hf_hub_download / repocard.metadata_*，在 1.x 仍存在。
override-dependencies = ["huggingface-hub>=1.29.0"]
